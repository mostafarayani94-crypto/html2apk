name: Build APK

# الإعدادات كلها في app/config.json (الصفحة html2apk.html بتكتبه). التشغيل من غير مدخلات.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check config and run tests
        run: |
          test -f app/config.json || { echo "::error::app/config.json مش موجود"; exit 1; }
          node test/builder.test.js

      - name: Unpack ZIP source
        run: |
          SRC=$(node -p "require('./app/config.json').source || 'html'")
          echo "SOURCE=$SRC" >> "$GITHUB_ENV"
          if [ "$SRC" = zip ]; then
            test -f app/app.zip || { echo "::error::app/app.zip مش موجود"; exit 1; }
            mkdir www-zip && unzip -q app/app.zip -d www-zip
          elif [ "$SRC" = html ]; then
            test -f app/index.html || { echo "::error::app/index.html مش موجود"; exit 1; }
          fi

      - name: Prepare web files and Capacitor config
        run: |
          node scripts/builder.js prepare
          cat capacitor.config.json
          if [ -f app/icon.png ]; then mkdir -p assets && cp app/icon.png assets/icon.png; fi

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Apply app settings (manifest, orientation, fullscreen...)
        run: node scripts/builder.js patch

      - name: Generate app icons
        if: env.HAS_ICON == 'true'
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#000000'

      - name: Set versionCode / versionName
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        if: env.OUT_APK == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build AAB
        if: env.OUT_AAB == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Sign
        if: env.OUT_APK == 'true' || env.OUT_AAB == 'true'
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::مفيش KEYSTORE secrets. الملفات متوقّعة بمفتاح مؤقت: مش هتتثبت كتحديث ومش هتنفع لـ Google Play."
            KS_PASS=temp-pass-123456; KEY_ALIAS=temp; KEY_PASS=$KS_PASS
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias temp -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" -dname "CN=temp"
          fi
          export KS_PASS KEY_PASS
          mkdir -p out
          if [ "$OUT_APK" = true ]; then
            "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "out/app-$RUN_NUMBER.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "out/app-$RUN_NUMBER.apk" | head -3
          fi
          if [ "$OUT_AAB" = true ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/app-$RUN_NUMBER.aab"
            jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass:env KS_PASS -keypass:env KEY_PASS \
              -sigalg SHA256withRSA -digestalg SHA-256 "out/app-$RUN_NUMBER.aab" "$KEY_ALIAS"
            jarsigner -verify "out/app-$RUN_NUMBER.aab" | head -2
          fi

      - name: Pack Android Studio project
        if: env.OUT_PROJECT == 'true'
        run: |
          mkdir -p out
          zip -qr "out/android-project-$RUN_NUMBER.zip" android -x "android/.gradle/*" "android/*/build/*" "android/build/*" "android/local.properties"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build ${{ github.run_number }}
          body: "${{ env.APP_ID }} · ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})"
          files: out/*
