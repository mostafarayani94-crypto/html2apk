<style>
:root{--bg:#F2F6F4;--surface:#fff;--ink:#14231F;--muted:#586B65;--line:#D8E2DE;--accent:#0E6B5B;--accent-ink:#fff;--accent-soft:#DDEFE9;--warn:#C77D1A;--bad:#B3402F;--font:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic","DejaVu Sans",Arial,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1714;--surface:#16231F;--ink:#E6EFEB;--muted:#97ABA4;--line:#2A3B36;--accent:#4FC3A8;--accent-ink:#06201A;--accent-soft:#1B3A33;--shadow:0 1px 3px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0E1714;--surface:#16231F;--ink:#E6EFEB;--muted:#97ABA4;--line:#2A3B36;--accent:#4FC3A8;--accent-ink:#06201A;--accent-soft:#1B3A33;--shadow:0 1px 3px rgba(0,0,0,.5);color-scheme:dark}
:root{--shadow:0 1px 3px rgba(16,40,34,.12),0 4px 14px rgba(16,40,34,.06)}
*{box-sizing:border-box}
html{font-size:16px}html[data-fs="l"]{font-size:18px}html[data-fs="s"]{font-size:14.5px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:880px;margin:0 auto;padding:12px 14px 96px}
header.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header.top h1{font-size:1.2rem;margin:0;flex:1;overflow-wrap:anywhere}
.ib{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);box-shadow:var(--shadow);flex:none}
.ib svg{width:22px;height:22px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#0a3d52));color:var(--accent-ink);border-radius:18px;padding:18px 16px 16px;margin:0 0 14px;box-shadow:var(--shadow)}
.hero .tt{display:flex;align-items:center;gap:12px}
.hero .lg{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.hero .lg svg{width:26px;height:26px}
.hero h1{margin:0;font-size:1.35rem;line-height:1.2;flex:1}.hero small{display:block;opacity:.85;font-weight:400;font-size:.8rem;margin-top:2px}
.hero .ib{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.25);color:inherit;box-shadow:none}
.stats{display:flex;gap:8px;margin-top:14px}.stats div{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 6px;text-align:center}.stats b{display:block;font-size:1.15rem}.stats span{font-size:.72rem;opacity:.9}
.fb{flex:none;width:46px;height:52px;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:.62rem;font-weight:800;letter-spacing:.3px;color:#fff;background:#6b7a75;position:relative;overflow:hidden}
.fb::before{content:"";position:absolute;top:0;inset-inline-start:0;width:0;height:0;border-style:solid;border-width:0 14px 14px 0;border-color:transparent rgba(255,255,255,.35) transparent transparent}
.fb.x{background:#1D7A45}.fb.d{background:#2B579A}.fb.p{background:#C0392B}.fb.i2{background:#8e44ad}
.pickbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:92px;border:2px dashed var(--accent);border-radius:16px;background:var(--accent-soft);color:var(--accent);font-weight:700;cursor:pointer;text-align:center;padding:10px}.pickbtn svg{width:28px;height:28px}
.star{flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}.star svg{width:22px;height:22px}.star.on{color:#E0A800}.star.on svg{fill:#E0A800}
.dcard{border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}
.lockfull{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.padbox{text-align:center;width:100%;max-width:320px}.padbox .lg2{width:60px;height:60px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}.padbox .lg2 svg{width:32px;height:32px}
.padbox h3{margin:0 0 4px}.padbox p{margin:0 0 12px;color:var(--muted);min-height:1.5em}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0 18px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}.dots i.on{background:var(--accent)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;direction:ltr}.keys button{height:62px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}.keys button:active{background:var(--accent-soft)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg button{flex:1;min-height:42px;border:0;background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.9rem}.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem}
.btn:disabled{opacity:.5}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 8px;font-size:1.05rem}
input[type=text],input[type=search],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:70px}
label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
@media(max-width:480px){.filters{grid-template-columns:1fr 1fr}.filters select:last-child{grid-column:1/-1}}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:right;padding:12px;margin:0 0 10px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;box-shadow:var(--shadow)}
.card:active{background:var(--accent-soft)}
.card .ic{font-size:1.8rem;flex:none}
.card .tx{flex:1;min-width:0}.card b{display:block;overflow-wrap:anywhere}
.card .meta{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:.78rem;font-weight:600}
.grp{font-weight:700;color:var(--accent);margin:14px 4px 6px;font-size:.95rem}
.snip{font-size:.82rem;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
mark{background:#ffe27a;color:#222;border-radius:3px;padding:0 2px}
.chip.warn{background:#fbe6e2;color:var(--bad)}.chip.ok{background:#e3f4e7;color:#1f7a3a}
.selbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 2px;flex-wrap:wrap}
.cbx{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted,#999);flex:none;display:grid;place-items:center;color:#fff}.cbx.on{background:var(--accent);border-color:var(--accent)}.cbx svg{width:14px;height:14px;stroke:#fff}
.card.picked{outline:2px solid var(--accent)}

:root[data-theme=dark][data-color=sage]{--accent:#96C4AE;--accent-soft:#1D3329;--bg:#0F1713;--surface:#17241E;--line:#2A3C34;--accent-ink:#101418}

:root[data-theme=dark][data-color=slate]{--accent:#A5B5C4;--accent-soft:#232E38;--bg:#10151A;--surface:#182027;--line:#2B3742;--accent-ink:#101418}
:root[data-color=lavender]{--accent:#7A6BA8;--accent-soft:#E6E2F2;--bg:#F3F1F8}
@media(prefers-color-scheme:dark){:root[data-color=lavender]:not([data-theme=light]){--accent:#B5A8E0;--accent-soft:#2A2440;--bg:#131120;--surface:#1B1829;--line:#302C45;--accent-ink:#101418}}
:root[data-theme=dark][data-color=lavender]{--accent:#B5A8E0;--accent-soft:#2A2440;--bg:#131120;--surface:#1B1829;--line:#302C45;--accent-ink:#101418}
:root[data-color=sand]{--accent:#9A7240;--accent-soft:#F0E4D2;--bg:#F8F4EE}
@media(prefers-color-scheme:dark){:root[data-color=sand]:not([data-theme=light]){--accent:#D9B88A;--accent-soft:#3A2F20;--bg:#17130E;--surface:#201A13;--line:#3A3126;--accent-ink:#101418}}
:root[data-theme=dark][data-color=sand]{--accent:#D9B88A;--accent-soft:#3A2F20;--bg:#17130E;--surface:#201A13;--line:#3A3126;--accent-ink:#101418}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}.sw2{width:42px;height:42px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:var(--shadow)}.sw2[aria-pressed=true]{border-color:var(--ink);outline:2px solid var(--surface);outline-offset:-5px}
.pvimg{max-width:100%;height:auto;border-radius:10px;display:block;margin:0 auto}
.hero{padding:10px 12px;margin:0 0 10px}.hero .lg{width:40px;height:40px;border-radius:11px;background:transparent;overflow:hidden;object-fit:cover}
.hero h1{font-size:1.2rem}.hero small{font-size:.74rem}.hero .ib{width:38px;height:38px}.statline{margin-top:6px;font-size:.78rem;opacity:.92}
.selbar select{width:auto;min-width:140px;padding:6px 10px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:start;padding:14px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;min-height:112px}
.scard .ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:4px}.scard b{font-size:1rem}.scard small{color:var(--muted);font-size:.78rem}
.tunebox{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}.tune{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}.tune .ctl{display:flex;align-items:center;gap:10px}.tune .v{min-width:64px;text-align:center;font-weight:700;font-size:1.1rem}
.rb{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1;cursor:pointer;box-shadow:var(--shadow);color:var(--accent)}.rb:active{background:var(--accent-soft)}
.modal input[type=text]{width:100%;margin:8px 0}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin:0 0 10px;font-size:.9rem}
.banner.err{background:#fbe6e2;color:var(--bad)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .banner.err{background:#3a1f1b;color:#ffb4a8}}
:root[data-theme=dark] .banner.err{background:#3a1f1b;color:#ffb4a8}
.sw{position:relative}.sw svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:12px;color:var(--muted);width:20px;height:20px}.sw input{padding-inline-start:42px}
nav.bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
nav.bar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.75rem;color:var(--muted);cursor:pointer;padding:0}
nav.bar button .pl{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
nav.bar button[aria-current=true]{color:var(--accent);font-weight:700}
nav.bar button[aria-current=true] .pl{background:var(--accent-soft)}
.fab{position:fixed;bottom:86px;left:16px;z-index:6;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;display:flex;align-items:center;justify-content:center}.fab svg{width:28px;height:28px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90%;font-size:.9rem;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:18px;max-width:420px;width:100%}
.modal h3{margin:0 0 8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:.92rem}.kv span:first-child{color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.tabs button{flex:none;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.85rem}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tw table{border-collapse:collapse;font-size:.82rem;min-width:100%}
.tw td{border:1px solid var(--line);padding:3px 6px;vertical-align:middle;white-space:pre-wrap;min-width:48px}
.tw td.hit{background:#ffe27a;color:#222}
.muted{color:var(--muted);font-size:.85rem}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.draft{display:flex;gap:8px;align-items:center;margin:6px 0}.draft input{flex:1}
.bar2{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0}.bar2>i{display:block;height:100%;background:var(--accent)}
</style>

/* ===== قاعدة البيانات (IndexedDB) ===== */
let DB=null;
const reqP=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const txDone=t=>new Promise((ok,no)=>{t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new Error('تعذر الحفظ (قد تكون المساحة ممتلئة)'))});
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open('moh_archive',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('meta',{keyPath:'id'});d.createObjectStore('blobs');d.createObjectStore('texts');d.createObjectStore('kv')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
const dbGet=(st,k)=>reqP(DB.transaction(st).objectStore(st).get(k));
const dbAll=st=>reqP(DB.transaction(st).objectStore(st).getAll());
async function kvSet(k,v){S.kv[k]=v;const t=DB.transaction('kv','readwrite');t.objectStore('kv').put(v,k);await txDone(t)}
async function saveRec(meta,buf,text){const t=DB.transaction(['meta','blobs','texts'],'readwrite');t.objectStore('meta').put(meta);if(buf)t.objectStore('blobs').put(buf,meta.id);if(text!==undefined)t.objectStore('texts').put(text,meta.id);await txDone(t)}
async function delRec(id){const t=DB.transaction(['meta','blobs','texts'],'readwrite');['meta','blobs','texts'].forEach(s=>t.objectStore(s).delete(id));await txDone(t)}
async function loadAll(){
  const all=await dbAll('meta'),lim=Date.now()-30*864e5;S.recs=[];S.trash=[];
  for(const m of all){if(m.del){if(new Date(m.del).getTime()<lim){try{await delRec(m.id)}catch(e){}}else S.trash.push(m)}else S.recs.push(m)}
  const kv=await new Promise(ok=>{const o={};const c=DB.transaction('kv').objectStore('kv').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){o[cur.key]=cur.value;cur.continue()}else ok(o)};c.onerror=()=>ok(o)});
  S.kv=kv;S.cats=Array.isArray(kv.cats)&&kv.cats.length?kv.cats:DEF_CATS.slice();
  S.raw=new Map();S.nrm=new Map();
  await new Promise(ok=>{const c=DB.transaction('texts').objectStore('texts').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){S.raw.set(cur.key,cur.value);cur.continue()}else ok()};c.onerror=()=>ok()});
}
function nrmText(id){let v=S.nrm.get(id);if(v===undefined){const r=S.raw.get(id)||'';v=norm(r);S.nrm.set(id,v)}return v}

  if(ssS)for(const si of xml(ssS).getElementsByTagName('si')){let t='';for(const c of si.childNodes){if(c.nodeName==='t')t+=c.textContent;else if(c.nodeName==='r'){for(const x of c.childNodes)if(x.nodeName==='t')t+=x.textContent}}sst.push(t)}

  for(let i=0;i<text.length&&rows.length<20000;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===dl){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}

}

async function deliver(name,bytes,mime){
  const blob=new Blob([bytes],{type:mime||'application/octet-stream'});
  const P=window.Capacitor&&Capacitor.Plugins;
  try{
    if(P&&P.Filesystem&&P.Share&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()){
      const u8=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);let bin='';const CH=0x8000;for(let i=0;i<u8.length;i+=CH)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
      const w=await P.Filesystem.writeFile({path:name,data:btoa(bin),directory:'CACHE'});await P.Share.share({title:name,url:w.uri,dialogTitle:'مشاركة'});return 'shared'}
  }catch(e){if(/cancel/i.test(String(e&&e.message)))return 'cancel'}
  try{const f=new File([blob],name,{type:blob.type});
    if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){try{await navigator.share({files:[f],title:name});return 'shared'}catch(e){if(e&&e.name==='AbortError')return 'cancel'}}}catch(e){}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},60000);return 'download';
}

  try{

      const uris=[];for(let k=0;k<files.length;k++){const u8=files[k].bytes instanceof Uint8Array?files[k].bytes:new Uint8Array(files[k].bytes);let bin='';const CH=0x8000;for(let i=0;i<u8.length;i+=CH)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
        const w=await P.Filesystem.writeFile({path:nm[k],data:btoa(bin),directory:'CACHE'});uris.push(w.uri)}

  try{const fl=files.map((f,k)=>new File([new Blob([f.bytes],{type:f.mime||'application/octet-stream'})],nm[k],{type:f.mime||'application/octet-stream'}));

    used.add(k+'#'+n);const rb=B.rows[j];

async function pickZip(zf){

      if(names.some(n=>/^manifest\.json$/i.test(n))&&names.some(n=>/^(files|blobs)\//i.test(n))){S.busy=null;toast('ده ملف نسخة احتياطية من التطبيق. استخدم «استرجاع نسخة» من الإعدادات > النسخة الاحتياطية');render();return}

function checkSheet(sh){
  const R=sh.rows.length,C=sh.cols,cv=coverMap(sh),ne=r=>sh.rows[r].filter(x=>x!=='').length;
  let first=-1,last=-1;for(let r=0;r<R;r++)if(ne(r)>=3){if(first<0)first=r;last=r}
  if(first<0)return [];
  const {hr,lab}=headerLabels(sh),st=Math.max(first,hr+1);if(last<st)return [];
  const n=last-st+1,act=[];
  for(let c=0;c<C;c++){let f=0;for(let r=st;r<=last;r++)if(sh.rows[r][c]!==''||(cv[r][c]&&!cv[r][c].o))f++;if(f/n>=0.5)act.push(c)}
  const out=[];
  for(let r=st;r<=last;r++){
    const filled=act.filter(c=>sh.rows[r][c]!==''||(cv[r][c]&&!cv[r][c].o)).length;
    if(filled<Math.max(2,Math.ceil(act.length*0.5)))continue;
    const cols=act.filter(c=>sh.rows[r][c]===''&&!cv[r][c]).map(c=>lab[c]);
    if(cols.length)out.push({row:r+1,key:sh.rows[r].find(v=>v!==''&&!isNum(v))||'',cols});
  }
  return out;
}

  $('#app').style.visibility=S.locked?'hidden':'';

  if(S.view==='detail')openPreview();
}
async function buildIndexXlsx(){
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',x=esc,L=['م','اسم البيان','التصنيف','السنة','الشهر','اسم الملف','الحجم','تاريخ الإضافة','ملاحظة'],W=[5,38,16,8,12,36,12,14,34];
  const col=i=>String.fromCharCode(65+i);
  const rows=[L.map(t=>({t,s:1}))];
  [...S.recs].sort(cmpRec).forEach((r,i)=>rows.push([{n:i+1},{t:r.name},{t:r.cat},{n:r.year},{t:r.month?MONTHS[r.month-1]:''},{t:r.fname||''},{t:sizeTxt(r.size||0)},{t:(r.addedAt||'').slice(0,10)},{t:r.note||''}]));
  const sd=rows.map((row,ri)=>`<row r="${ri+1}">`+row.map((c,ci)=>c.n!==undefined?`<c r="${col(ci)}${ri+1}"><v>${c.n}</v></c>`:`<c r="${col(ci)}${ri+1}" t="inlineStr"${c.s?' s="1"':''}><is><t xml:space="preserve">${x(c.t)}</t></is></c>`).join('')+'</row>').join('');
  const z=new JSZip();
  z.file('[Content_Types].xml',H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');
  z.file('_rels/.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  z.file('xl/workbook.xml',H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="الفهرس" sheetId="1" r:id="rId1"/></sheets></workbook>');
  z.file('xl/_rels/workbook.xml.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  z.file('xl/styles.xml',H+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><name val="Arial"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>');
  z.file('xl/worksheets/sheet1.xml',H+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>'+W.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols><sheetData>'+sd+'</sheetData></worksheet>');
  return await z.generateAsync({type:'uint8array',compression:'DEFLATE'});
}
async function openPreview(){
  const r=S.recs.find(x=>x.id===S.id);if(!r||(S.pv&&S.pv.id===r.id))return;
  if(/^(png|jpe?g|gif|webp)$/.test(r.ext)){const id=r.id;S.pv={id};try{const buf=await dbGet('blobs',id);if(S.id!==id)return;S.pv={id,img:URL.createObjectURL(new Blob([buf],{type:r.mime||MIME[r.ext]||'image/jpeg'}))}}catch(e){S.pv={id,err:'تعذرت معاينة الصورة'}}if(S.view==='detail'&&S.id===id)render();return}
  if(!/^(xlsx|xlsm|csv|tsv|txt)$/.test(r.ext))return;
  const id=r.id;S.pv={id,wb:null};
  try{const buf=await dbGet('blobs',id),wb=await readWb(buf,r.ext);if(S.id!==id)return;if(!wb||!wb.sheets.length)throw new Error('الملف فاضي');S.pv={id,wb};S.sheet=0}
  catch(e){S.pv={id,err:'تعذرت معاينة الملف ('+(e.message||e)+'). يمكنك مشاركته من الزرار فوق.'}}
  if(S.view==='detail'&&S.id===id)render();
}

async function addSave(force){
  const ds=S.drafts;if(!ds.length)return;
  if(force!==true){const cf=ds.filter(d=>S.recs.some(x=>norm(x.name)===norm(d.name.trim())&&x.year===d.year&&x.month===d.month));
    if(cf.length){S.confirm={t:'ملف بنفس الاسم والشهر',m:'فيه بالفعل «'+cf[0].name+'» في '+(cf[0].month?MONTHS[cf[0].month-1]+' ':'')+cf[0].year+(cf.length>1?' (وكمان '+(cf.length-1)+' زيه)':'')+'. تضيفه برضه؟',ok:'أضفه برضه',fn:()=>addSave(true)};render();return}}
  const note=($('#fnote')||{value:''}).value.trim();
  S.addF={cat:ds[0].cat,note};S.busy='جارٍ الحفظ…';S.prog=0;render();
  let ok=0,dup=[],fail=[];
  for(let i=0;i<ds.length;i++){const d=ds[i];S.busy='جارٍ حفظ '+(i+1)+' من '+ds.length+'…';S.prog=Math.round(i/ds.length*100);render();
    try{const buf=await d.f.arrayBuffer(),hash=await hashBuf(buf),same=S.recs.find(r=>r.hash===hash);
      if(same){dup.push(d.name+' (موجود باسم «'+same.name+'»)');continue}
      const ext=extOf(d.f.name),ex=d.ex||await extractFor(buf,ext),cat=d.cat,year=d.year,month=d.month;
      const meta={id:uid(),name:d.name.trim()||d.f.name,cat,year,month,note,fname:d.f.name,ext,size:buf.byteLength,mime:d.f.type||MIME[ext]||'',hash,addedAt:new Date().toISOString(),sheets:ex.sheets};
      await saveRec(meta,buf,ex.text);S.recs.push(meta);S.raw.set(meta.id,ex.text);S.nrm.delete(meta.id);ok++;
      if(ex.ok===false&&!ex.none)fail.push(d.name)}
    catch(e){fail.push(d.name+' ('+(e.message||e)+')')}}
  if(S.newCat){S.newCat=0;await kvSet('cats',S.cats)}
  await kvSet('since',(S.kv.since||0)+ok);S.busy=null;S.prog=0;S.drafts=[];S.tplPre=null;
  let m='تم حفظ '+ok+' ملف';if(dup.length)m+=' · تخطي مكرر: '+dup.join('، ');if(fail.length)m+=' · تعذرت قراءة محتوى: '+fail.join('، ');
  toast(m);S.view='home';try{history.replaceState({v:'home'},'')}catch(e){}render();
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  const rec=()=>S.recs.find(x=>x.id===S.id);
  switch(a){
    case 'nav': if(el.dataset.v!=='add')S.tplPre=null;go(el.dataset.v);break;
    case 'back': history.length>1?history.back():go('home');break;
    case 'open':{S.pv=null;S.sheet=0;const rc=(S.kv.recent||[]).filter(x=>x!==el.dataset.id);rc.unshift(el.dataset.id);kvSet('recent',rc.slice(0,15));go('detail',el.dataset.id);break}
    case 'tab': S.tab=el.dataset.v;render();break;
    case 'showyear': S.fy=el.dataset.y;render();break;
    case 'selon': S.sel=new Set();render();break;
    case 'selx': S.sel=null;render();break;
    case 'selt':{const id=el.dataset.id;if(S.sel.has(id))S.sel.delete(id);else S.sel.add(id);const rs=$('#res');if(rs)rs.innerHTML=listHtml();break}
    case 'sharesel':{const ids=[...S.sel];S.busy='جارٍ تجهيز الملفات…';render();try{const files=[];for(const id of ids){const x=S.recs.find(q=>q.id===id);if(!x)continue;files.push({name:x.fname||(safeName(x.name)+'.'+x.ext),bytes:await dbGet('blobs',id),mime:x.mime||MIME[x.ext]})}S.busy=null;S.sel=null;S.multi={files,fb:false}}catch(x){S.busy=null;toast('تعذر التجهيز: '+(x.message||x))}render();break}
    case 'mshare':{const m=S.multi;const res=await deliverMulti(m.files);if(res==='shared'||res==='cancel'){S.multi=null}else{m.fb=true;toast('الجهاز ما دعمش إرسال أكتر من ملف مرة واحدة')}render();break}
    case 'mone':{const f=S.multi.files[+el.dataset.i];await doDeliver(f.name,f.bytes,f.mime);break}
    case 'mclose': S.multi=null;render();break;
    case 'chk': runCheck();break;
    case 'trrest':{const x=S.trash.find(q=>q.id===el.dataset.id);if(!x)break;delete x.del;await saveRec(x);S.trash=S.trash.filter(q=>q!==x);S.recs.push(x);const tx=await dbGet('texts',x.id);if(tx!==undefined)S.raw.set(x.id,tx);S.nrm.delete(x.id);toast('تم الاسترجاع');render();break}
    case 'trdel':{const x=S.trash.find(q=>q.id===el.dataset.id);if(!x)break;S.confirm={t:'حذف نهائي',m:'«'+x.name+'» هيتمسح خالص ومش هتقدر ترجعه.',ok:'حذف نهائي',danger:true,fn:async()=>{await delRec(x.id);S.trash=S.trash.filter(q=>q!==x);toast('تم الحذف نهائيًا')}};render();break}
    case 'trall':{S.confirm={t:'تفريغ السلة',m:'كل الملفات اللي في السلة ('+S.trash.length+') هتتمسح نهائيًا.',ok:'تفريغ',danger:true,fn:async()=>{for(const x of S.trash)await delRec(x.id);S.trash=[];toast('تم تفريغ السلة')}};render();break}
    case 'color':{await kvSet('color',el.dataset.v);applyColor();render();break}
    case 'fine': S.fine=!S.fine;render();break;
    case 'adj':{const u=curHSL(),k=el.dataset.k,d=+el.dataset.d,st={h:5,s:5,l:3}[k];u[k]=k==='h'?(u.h+d*st+360)%360:k==='s'?Math.max(10,Math.min(90,u.s+d*st)):Math.max(25,Math.min(50,u.l+d*st));await kvSet('cust',u);await kvSet('color','custom');applyColor();render();break}
    case 'colorreset':{await kvSet('color','blue');await kvSet('cust',null);applyColor();render();break}
    case 'sec': S.sec=el.dataset.k;S.fine=false;go('sec');break;
    case 'catren': S.ren={i:+el.dataset.i};render();setTimeout(()=>{const e=$('#renin');if(e){e.focus();e.select()}},50);break;
    case 'renx': S.ren=null;render();break;
    case 'rensave':{const i=S.ren.i,old=S.cats[i],nv=($('#renin').value||'').trim();S.ren=null;if(!nv||nv===old){render();break}
      if(S.cats.includes(nv))S.cats.splice(i,1);else S.cats[i]=nv;
      for(const x of [...S.recs,...S.trash])if(x.cat===old){x.cat=nv;await saveRec(x)}
      await kvSet('cats',S.cats);if(tpls().some(t=>t.cat===old))await kvSet('tpls',tpls().map(t=>t.cat===old?{...t,cat:nv}:t));
      toast('تم تغيير اسم التصنيف');render();break}
    case 'archyear':{const y=+el.dataset.y,A=arch().slice();const i=A.indexOf(y);if(i<0)A.push(y);else A.splice(i,1);await kvSet('arch',A);toast(i<0?'تمت أرشفة '+y:'تم إرجاع '+y);render();break}
    case 'idxx':{S.busy='جارٍ تجهيز الفهرس…';render();try{const by=await buildIndexXlsx();S.busy=null;readyShare('فهرس_الأرشيف_'+today()+'.xlsx',by,MIME.xlsx)}catch(x){S.busy=null;toast('تعذر: '+(x.message||x))}render();break}
    case 'tpladd': S.tplPre={name:el.dataset.n,cat:el.dataset.c,year:+el.dataset.y,month:+el.dataset.m};S.drafts=[];go('add');break;
    case 'tpladdnew':{const n=($('#tplname').value||'').trim(),c=$('#tplcat').value;if(n){const T=tpls().slice();T.push({name:n,cat:c});await kvSet('tpls',T);render()}break}
    case 'tplrm':{const T=tpls().slice();T.splice(+el.dataset.i,1);await kvSet('tpls',T);render();break}
    case 'fav':{e.stopPropagation();const x=S.recs.find(q=>q.id===el.dataset.id);x.fav=!x.fav;await saveRec(x);render();break}
    case 'pinrec':{const x=rec();x.pin=!x.pin;await saveRec(x);toast(x.pin?'تم التثبيت في أول القايمة':'تم إلغاء التثبيت');render();break}
    case 'favrec':{const x=rec();x.fav=!x.fav;await saveRec(x);render();break}
    case 'cmp':{const x=rec();const cand=S.recs.filter(q=>q.id!==x.id&&/^(xlsx|xlsm|csv|tsv)$/.test(q.ext));const pv=q=>q.year*13+(q.month||0),xv=pv(x);const sug=cand.filter(q=>norm(q.name).replace(/[٠-٩0-9]/g,'').includes(norm(x.name).replace(/[٠-٩0-9]/g,'').slice(0,8))||q.cat===x.cat).sort((p,q)=>{const dp=xv-pv(p),dq=xv-pv(q);return (dp>0?dp:1e6-dp)-(dq>0?dq:1e6-dq)});S.cmp={a:x.id,b:sug[0]?sug[0].id:null};go('cmp');if(S.cmp.b)runCompare();break}
    case 'rmdraft': S.drafts.splice(+el.dataset.i,1);render();break;
    case 'addsave': addSave();break;
    case 'backup': doBackup(false);break;
    case 'backupinc': doBackup(true);break;
    case 'bkto':{await kvSet('bkTo',el.dataset.v);S.bkAsk=false;toast('تمام، هفتكر: '+el.dataset.v);render();break}
    case 'bkskip': S.bkAsk=false;render();break
    case 'snooze': await kvSet('snooze',today());render();break;
    case 'sheet': S.sheet=+el.dataset.i;render();break;
    case 'edit': go('edit');break;
    case 'saveedit':{const r=rec();if(!r)break;r.name=$('#en').value.trim()||r.name;r.cat=$('#ec').value;r.year=+$('#ey').value;r.month=+$('#em').value;r.note=$('#eno').value.trim();
      try{await saveRec(r);toast('تم الحفظ');history.back()}catch(x){toast('تعذر الحفظ: '+x.message)}break}
    case 'del':{const r=rec();S.confirm={t:'حذف الملف',m:'«'+r.name+'» هيتنقل لسلة المحذوفات، وتقدر ترجّعه خلال 30 يوم.',ok:'حذف',danger:true,fn:async()=>{r.del=new Date().toISOString();r.fav=false;r.pin=false;await saveRec(r);S.recs=S.recs.filter(x=>x.id!==r.id);S.trash.push(r);S.raw.delete(r.id);S.nrm.delete(r.id);S.pv=null;toast('اتنقل لسلة المحذوفات');S.view='home';try{history.replaceState({v:'home'},'')}catch(x){}}};render();break}
    case 'cok':{const c=S.confirm;S.confirm=null;try{await c.fn()}catch(x){toast('تعذر: '+x.message)}render();break}
    case 'cno': S.confirm=null;render();break;
    case 'key': padKey(el.dataset.k);break;
    case 'keydel': padKey('del');break;
    case 'padx': S.pad=null;render();break;
    case 'pinset': S.pad={mode:'set1',buf:''};render();break;
    case 'pinchg': S.pad={mode:'chg',buf:''};render();break;
    case 'pinrem': S.pad={mode:'rem',buf:''};render();break;
    case 'locknow': lockNow();break;
    case 'rshare':{const q=S.ready;S.ready=null;render();await doDeliver(q.name,q.bytes,q.mime);if(q.bk){await kvSet('lastBackup',new Date().toISOString());await kvSet('since',0);S.bkAsk=true;render()}break}
    case 'rclose': S.ready=null;render();break;
    case 'shareorig':{const r=rec(),buf=await dbGet('blobs',r.id);await doDeliver(r.fname||(safeName(r.name)+'.'+r.ext),buf,r.mime||MIME[r.ext]);break}
    case 'sharedocx':{const r=rec();S.busy='جارٍ تجهيز ملف Word…';render();try{const wb=S.pv&&S.pv.wb||await readWb(await dbGet('blobs',r.id),r.ext);const by=await buildDocx(r,wb);S.busy=null;readyShare(safeName(r.name)+'.docx',by,MIME.docx)}catch(x){S.busy=null;render();toast('تعذر تجهيز Word: '+x.message)}break}
    case 'sharepdf':{const r=rec();S.busy='جارٍ تجهيز ملف PDF…';S.prog=0;render();try{const wb=S.pv&&S.pv.wb||await readWb(await dbGet('blobs',r.id),r.ext);
      const bytes=await buildPdf(r,wb,(i,n)=>{S.busy='جارٍ تجهيز PDF… صفحة '+i+' من '+n;S.prog=Math.round(i/n*100);render()});S.busy=null;S.prog=0;readyShare(safeName(r.name)+'.pdf',bytes,MIME.pdf)}catch(x){S.busy=null;S.prog=0;render();toast('تعذر تجهيز PDF: '+x.message)}break}
    case 'rmcat':{const c=S.cats[+el.dataset.i];if(S.cats.length<=1)break;S.cats.splice(+el.dataset.i,1);await kvSet('cats',S.cats);render();break}
    case 'addcat':{const v=$('#newcat').value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);await kvSet('cats',S.cats);render()}break}
    case 'persist':{try{const ok=await navigator.storage.persist();toast(ok?'تم تفعيل التخزين الدائم':'الجهاز رفض الطلب')}catch(x){toast('غير مدعوم على هذا الجهاز')}render();break}
    case 'theme':{const cur=S.kv.theme||'auto',t=el.dataset.v||THEMES[(THEMES.indexOf(cur)+1)%3];await setTheme(t);toast('الوضع: '+TH_L[t]);break}
    case 'fs':{document.documentElement.dataset.fs=el.dataset.v;await kvSet('fs',el.dataset.v);break}
  }
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){S.q=t.value;const r=$('#res');if(r)r.innerHTML=listHtml()}
  else if(t.dataset&&t.dataset.dn!==undefined){S.drafts[+t.dataset.dn].name=t.value}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.f==='so'){kvSet('so',t.value);const r=$('#res');if(r)r.innerHTML=listHtml()}
  else if(t.dataset&&t.dataset.f){S[t.dataset.f]=t.value;const r=$('#res');if(r)r.innerHTML=listHtml()}
  else if(t.id==='pick'){pickFiles(t.files)}
  else if(t.id==='pickdir'){pickFiles(t.files);t.value=''}
  else if(t.id==='pickzip'){const zf=t.files&&t.files[0];t.value='';pickZip(zf)}
  else if(t.dataset&&t.dataset.dm!==undefined){S.drafts[+t.dataset.dm].month=+t.value;S.drafts[+t.dataset.dm].guess=false}
  else if(t.dataset&&t.dataset.dy!==undefined){S.drafts[+t.dataset.dy].year=+t.value;S.drafts[+t.dataset.dy].guess=false}
  else if(t.dataset&&t.dataset.dc!==undefined){S.drafts[+t.dataset.dc].cat=t.value}
  else if(t.id==='cmpb'){S.cmp.b=t.value||null;if(S.cmp.b)runCompare();else{S.cmp.res=null;render()}}
  else if(t.id==='restore'&&t.files[0]){doRestore(t.files[0]);t.value=''}});

(async function init(){
  try{DB=await openDB();await loadAll();if(S.kv.fs)document.documentElement.dataset.fs=S.kv.fs;applyTheme();applyColor();
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    try{history.replaceState({v:'home'},'')}catch(e){}
    if(hasPin()){S.locked=true;S.pad={mode:'unlock',buf:''}}
    window.__app={S,results,readWb,buildPdf,buildDocx,render,go,guessPeriod,compareSheets};
    render();
  }catch(e){$('#app').innerHTML='<div class="empty">تعذر فتح قاعدة البيانات على هذا الجهاز: '+esc(e.message||e)+'</div>'}
})();
</script>
