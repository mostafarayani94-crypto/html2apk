name: Create keystore

# بيولّد مفتاح توقيع جديد ويرفعه كـ Artifact (يوم واحد). شغّله في مستودع خاص بس.
# بعد التنزيل: ضيف القيم في Secrets، وبعدها امسح الـ run والـ artifact.
on:
  workflow_dispatch:
    inputs:
      alias:
        description: اسم المفتاح (alias)
        required: true
        default: release
      validity_years:
        description: الصلاحية بالسنين
        required: true
        default: '30'

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        env:
          KEY_ALIAS: ${{ inputs.alias }}
          YEARS: ${{ inputs.validity_years }}
        run: |
          set -euo pipefail
          [[ "$KEY_ALIAS" =~ ^[A-Za-z0-9_-]{1,30}$ ]] || { echo "::error::alias غلط"; exit 1; }
          [[ "$YEARS" =~ ^[0-9]{1,2}$ ]] && [ "$YEARS" -ge 1 ] || { echo "::error::الصلاحية غلط"; exit 1; }
          PASS=$(openssl rand -hex 16)
          mkdir out
          keytool -genkeypair -keystore out/release.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
            -validity $((YEARS * 365)) -storepass "$PASS" -keypass "$PASS" -dname "CN=App, O=App, C=US"
          base64 -w0 out/release.jks > out/KEYSTORE_BASE64.txt
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "(KEYSTORE_BASE64 في الملف KEYSTORE_BASE64.txt)"
          } > out/SECRETS.txt
          echo "::add-mask::$PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: out/
          retention-days: 1
